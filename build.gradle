buildscript {
	repositories {
		maven { url = "https://maven.fabricmc.net/" }
		gradlePluginPortal()
	}
	dependencies {
		classpath "net.fabricmc:fabric-loom:${loom_version}"
	}
}

def minecraftVersion = project.minecraft_version.toString()
def legacyMinecraft = minecraftVersion == "1.21.11"
def javaVersion = legacyMinecraft ? 21 : 25
def minecraftRequirement = project.minecraft_requirement.toString()

apply plugin: legacyMinecraft ? "fabric-loom" : "net.fabricmc.fabric-loom"
apply plugin: "maven-publish"

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"smart-item-highlight" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (legacyMinecraft) {
		mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	}
	if (legacyMinecraft) {
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	inputs.property "minecraft_requirement", minecraftRequirement
	inputs.property "java_version", javaVersion

	filesMatching("fabric.mod.json") {
		expand(
				"version": version,
				"minecraft_requirement": minecraftRequirement,
				"java_version": javaVersion
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

if (legacyMinecraft) {
	sourceSets.client.java {
		setSrcDirs(["src/legacy12111/java"])
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

tasks.named("jar") {
	archiveBaseName = "smart-item-highlight-${minecraftVersion}"
}

tasks.named("sourcesJar") {
	archiveBaseName = "smart-item-highlight-${minecraftVersion}"
}

tasks.matching { it.name in ["remapJar", "remapSourcesJar"] }.configureEach {
	archiveBaseName = "smart-item-highlight-${minecraftVersion}"
}

def versionBuilds = [
		"1.21.11": [
				fabricApi: "0.141.1+1.21.11",
				loader: "0.18.1",
				loom: "1.14-SNAPSHOT",
				requirement: "~1.21.11"
		],
		"26.1": [
				fabricApi: "0.145.1+26.1",
				loader: "0.19.3",
				loom: "1.17-SNAPSHOT",
				requirement: ">=26.1 <26.2"
		],
		"26.2": [
				fabricApi: "0.156.0+26.2",
				loader: "0.19.3",
				loom: "1.17-SNAPSHOT",
				requirement: "~26.2"
		]
]

versionBuilds.each { targetVersion, target ->
	def taskSuffix = targetVersion.replace(".", "_")
	tasks.register("buildMinecraft${taskSuffix}", Exec) {
		group = "build"
		description = "Builds Smart Item Highlight for Minecraft ${targetVersion}."
		workingDir project.projectDir
		commandLine(
				"./gradlew",
				"build",
				"-Ploom_version=${target.loom}",
				"-Pminecraft_version=${targetVersion}",
				"-Pfabric_api_version=${target.fabricApi}",
				"-Ploader_version=${target.loader}",
				"-Pminecraft_requirement=${target.requirement}",
				"-Pyarn_mappings=${project.yarn_mappings}"
		)
	}
}

tasks.named("buildMinecraft26_1") {
	mustRunAfter "buildMinecraft1_21_11"
}

tasks.named("buildMinecraft26_2") {
	mustRunAfter "buildMinecraft26_1"
}

tasks.register("buildAllVersions") {
	group = "build"
	description = "Builds supported JARs for Minecraft 1.21.11 through 26.2."
	dependsOn "buildMinecraft1_21_11", "buildMinecraft26_1", "buildMinecraft26_2"
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
